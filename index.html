<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:title" content="Emilia's Flash Archive - Mobile" />
    <meta property="og:description" content="Play Flash Games on Mobile" />
    <meta property="og:url" content="https://mobile.flash.greatonthelakes.com/" />
    <meta property="og:image" content="https://flash.greatonthelakes.com/images/GOTL.png" />
    <meta property="og:type" content="website" />
    <title>Emilia's Flash Game Archive - Mobile</title>
    <link rel="shortcut icon" type="image/x-icon" href="./images/GOTL.ico">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://kit.fontawesome.com/39ffdb166a.js" crossorigin="anonymous"></script>
    <script>
      // Redirect desktop users to main site
      const isMobile = /\b(Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini)\b/i.test(navigator.userAgent);
      if (!isMobile) {
        window.location.href = "https://flash.greatonthelakes.com/";
      }
      
      // Check maintenance mode
      fetch("https://www.greatonthelakes.com/status.txt")
          .then(response => response.text())
          .then(data => {
            const flag = data.trim();
            if (flag === "1") {
              window.location.href = "503maintain.html";
            }
          })
          .catch(error => {
            console.error("Error checking maintenance mode:", error);
          });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="bchec.js"></script>
    <script src="service-worker.js"></script>
    <script src="backend.js"></script>
  </head>
<div id="navbar"></div>
<script src="components.js"></script>
<body>
  <div id="logo"></div>
  <h2>Notice: Due to the ongoing Cloudflare maintenance affecting multiple locations, parts of the website may not load or work as expected. There’s no need to contact me.</h2>
  <h1 class="spacer">spacer</h1>
  <h3 style="text-align: center; font-size: 22pt; padding-bottom: 25px">Welcome To Emilia's Flash Game Archive</h3>
  <h4 style="text-align: center; font-size: 16pt; padding-bottom: 15px; color: #f2b3c0;">When You Select a Game, It Will Open In a New Tab</h4>
  <div class="buttons"></div>
  <div id="navbar"></div>
</body>
</html>
